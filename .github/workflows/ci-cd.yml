name: "CI/CD Pipeline"
on:
  push:
    branches: [master]

env:
  IMAGE_NAME: ${{ github.repository_owner }}/mi-sitio-web

jobs:
  # ─────────────────────────────────────────
  # FASE 1 – CI
  # ─────────────────────────────────────────
  init:
    name: "CI · Init"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

  test:
    name: "CI · Test"
    runs-on: ubuntu-latest
    needs: [init]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: coverage/

  # build y los 4 SAST/SCA corren en paralelo después de test
  build:
    name: "CI · Build"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  sast-secrets:
    name: "CI · SAST Secrets"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan con Betterleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$(pwd):/repo" \
            ghcr.io/betterleaks/betterleaks:latest \
            git /repo \
              --report-format sarif \
              --report-path /repo/betterleaks.sarif \
              --exit-code 0 \
              -v
        continue-on-error: true
      - name: Upload resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

  sast-codeql:
    name: "CI · SAST CodeQL"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  sast-semgrep:
    name: "CI · SAST Semgrep"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            semgrep/semgrep:latest \
            semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/expressjs \
            --sarif \
            --output=/src/semgrep-results.sarif
      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  sca-snyk:
    name: "CI · SCA Snyk"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-results.sarif
      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('snyk-results.sarif') != '' }}
        with:
          sarif_file: snyk-results.sarif
          category: snyk-sca

  # ─────────────────────────────────────────
  # FASE 2 – CD  (gate: build + todos los SAST/SCA)
  # ─────────────────────────────────────────
  deploy:
    name: "CD · Deploy (Railway)"
    runs-on: ubuntu-latest
    needs: [build, sast-secrets, sast-codeql, sast-semgrep, sca-snyk]
    environment: production
    outputs:
      url: ${{ steps.railway-deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: railway-deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
          URL=$(railway domain --service ${{ secrets.RAILWAY_SERVICE_ID }} 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $URL"

      - name: Verify deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          URL=$(railway domain --service ${{ secrets.RAILWAY_SERVICE_ID }} 2>/dev/null)
          if [ -z "$URL" ]; then
            echo "No se pudo obtener la URL de Railway"
            exit 1
          fi
          echo "Verificando https://$URL ..."
          for i in $(seq 1 20); do
            if curl -sf "https://$URL"; then
              echo "Deploy exitoso en https://$URL"
              exit 0
            fi
            echo "Esperando... ($i/20)"
            sleep 5
          done
          echo "Deploy no respondió a tiempo" >&2
          exit 1

  dast:
    name: "CD · DAST ZAP"
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Get Railway URL
        id: get-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          URL=$(railway domain --service ${{ secrets.RAILWAY_SERVICE_ID }} 2>/dev/null)
          echo "target=https://$URL" >> $GITHUB_OUTPUT
          echo "Target para ZAP: https://$URL"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.get-url.outputs.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: "-I"
          artifact_name: zap-report
          fail_action: false


