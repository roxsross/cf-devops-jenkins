name: "CI/CD Pipeline"

on:
  push:
    branches: [master]

# ──────────────────────────────────────────────────────────────────────────────
# Orquestador de workflows reutilizables
#
# Flujo:
#   test ──► build  ──┐
#            sast   ──┼──► deploy ──► dast
#            sca    ──┘
#
# Cada fase está definida en .github/workflows/wf-*.yml
# ──────────────────────────────────────────────────────────────────────────────

# Permisos máximos requeridos por los reusable workflows hijos
permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  issues: write

jobs:
  # ── FASE 1: CI ─────────────────────────────────────────
  test:
    uses: ./.github/workflows/wf-test.yml

  build:
    needs: [test]
    uses: ./.github/workflows/wf-build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  sast:
    needs: [test]
    uses: ./.github/workflows/wf-sast.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write

  sca:
    needs: [build]
    uses: ./.github/workflows/wf-sca.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}

  # ── FASE 2: CD ─────────────────────────────────────────
  deploy:
    needs: [build, sast, sca]
    uses: ./.github/workflows/wf-deploy.yml
    secrets: inherit

  dast:
    needs: [deploy]
    uses: ./.github/workflows/wf-dast.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write
      issues: write
