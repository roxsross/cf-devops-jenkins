name: "CI/CD Pipeline"
on:
  push:
    branches: [master]

env:
  IMAGE_NAME: ${{ github.repository_owner }}/mi-sitio-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # FASE 1 – CI
  # ─────────────────────────────────────────
  init:
    name: "CI · Init"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  test:
    name: "CI · Test"
    runs-on: ubuntu-latest
    needs: [init]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: coverage/
          if-no-files-found: ignore

  # build y los 4 SAST/SCA corren en paralelo después de test
  build:
    name: "CI · Build"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  sast-secrets:
    name: "CI · SAST Secrets"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan con Betterleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$(pwd):/repo" \
            ghcr.io/betterleaks/betterleaks:latest \
            git /repo \
              --report-format sarif \
              --report-path /repo/betterleaks.sarif \
              --exit-code 0 \
              -v
        continue-on-error: true
      - name: Upload resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

  sast-codeql:
    name: "CI · SAST CodeQL"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  sast-semgrep:
    name: "CI · SAST Semgrep"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            semgrep/semgrep:latest \
            semgrep scan \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/expressjs \
            --sarif \
            --output=/src/semgrep-results.sarif
      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  sca-snyk:
    name: "CI · SCA Snyk"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-results.sarif
      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('snyk-results.sarif') != '' }}
        with:
          sarif_file: snyk-results.sarif
          category: snyk-sca

  sca-trivy:
    name: "CI · SCA Trivy"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image for Trivy
        run: docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy - image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image


  # ─────────────────────────────────────────
  # FASE 2 – CD  (gate: build + todos los SAST/SCA)
  # ─────────────────────────────────────────
  deploy:
    name: "CD · Deploy (Render)"
    runs-on: ubuntu-latest
    needs: [build, sast-secrets, sast-codeql, sast-semgrep, sca-snyk, sca-trivy]
    environment: production
    outputs:
      url: ${{ secrets.RENDER_APP_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsSL --retry 3 \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy disparado en Render"

      - name: Wait for deployment to be live
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          echo "Verificando $URL ..."
          for i in $(seq 1 24); do
            if curl -sf "$URL" > /dev/null; then
              echo "Deploy exitoso en $URL"
              exit 0
            fi
            echo "Esperando... ($i/24)"
            sleep 10
          done
          echo "Deploy no respondió a tiempo" >&2
          exit 1

  dast:
    name: "CD · DAST ZAP"
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Get target URL
        id: get-url
        run: |
          echo "target=${{ secrets.RENDER_APP_URL }}" >> $GITHUB_OUTPUT

      # ── ZAP (action) ─────────────────────────────────────
      - name: Run OWASP ZAP baseline scan (action)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.get-url.outputs.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: "-I"
          artifact_name: zap-report-action
          fail_action: false

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: python3 .github/scripts/zap-to-sarif.py

      - name: Upload ZAP SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: zap-results.sarif
          category: owasp-zap-dast

      # ── ZAP (docker) ─────────────────────────────────────
      - name: Run OWASP ZAP baseline scan (docker)
        if: always()
        run: |
          docker run --rm \
            -v "$(pwd):/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ secrets.RENDER_APP_URL }}" \
            -r zap-docker-report.html \
            -J zap-docker-report.json \
            -x zap-docker-report.xml \
            -I || true

      - name: Upload ZAP Docker reports as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report-docker
          path: |
            zap-docker-report.html
            zap-docker-report.json
            zap-docker-report.xml
          if-no-files-found: ignore

      # ── NUCLEI ───────────────────────────────────────────
      - name: Run Nuclei scan
        if: always()
        run: |
          docker run --rm \
            -v "$(pwd):/output" \
            projectdiscovery/nuclei:latest \
            -u "${{ secrets.RENDER_APP_URL }}" \
            -t http/misconfiguration \
            -t http/exposures \
            -t http/technologies \
            -severity low,medium,high,critical \
            -sarif-export /output/nuclei-results.sarif \
            -o /output/nuclei-results.txt \
            -silent || true

      - name: Validate Nuclei SARIF
        if: always()
        run: |
          [ -s nuclei-results.sarif ] || echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Nuclei","version":"latest","rules":[]}},"results":[]}]}' > nuclei-results.sarif

      - name: Upload Nuclei SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: nuclei-results.sarif
          category: nuclei-dast

      - name: Upload Nuclei report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nuclei-report
          path: nuclei-results.txt
          if-no-files-found: ignore

