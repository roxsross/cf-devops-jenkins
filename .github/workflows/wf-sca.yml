name: "WF · SCA"

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Short SHA tag de la imagen Docker a escanear"
        required: true
        type: string

env:
  IMAGE_NAME: ${{ github.repository_owner }}/mi-sitio-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Snyk (dependencias npm) ───────────────────────────────
  sca-snyk:
    name: "CI · SCA Snyk"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-results.sarif

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('snyk-results.sarif') != '' }}
        with:
          sarif_file: snyk-results.sarif
          category: snyk-sca

  # ── Trivy (imagen Docker + filesystem) ───────────────────
  sca-trivy:
    name: "CI · SCA Trivy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image for Trivy
        run: docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}

      - name: Run Trivy - image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy - filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
